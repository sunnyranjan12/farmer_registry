<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registry - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }
        .login-header i { font-size: 48px; margin-bottom: 16px; }
        .login-header h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .login-header p { font-size: 14px; opacity: 0.8; }
        .login-form { padding: 40px; }
        .input-group { margin-bottom: 24px; }
        .input-group label { display: block; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb;
            border-radius: 12px; font-size: 16px; transition: all 0.3s;
        }
        .input-group input:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42,82,152,0.1); }
        .btn-login {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-login:hover { transform: translateY(-2px); }
        .error-message { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 12px; font-size: 14px; margin-bottom: 20px; display: none; }
        .demo-credentials { margin-top: 24px; padding-top: 24px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #6b7280; text-align: center; }
        .demo-credentials code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-tractor"></i>
            <h1>Farmer Registry System</h1>
            <p>Government of Uttar Pradesh</p>
        </div>
        <div class="login-form">
            <div class="error-message" id="errorMessage"></div>
            <div class="input-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button class="btn-login" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login</button>
            <div class="demo-credentials">
                <p><strong>Demo Credentials:</strong></p>
                <p>Admin: <code>admin</code> / <code>Admin@123</code> | Editor: <code>editor</code> / <code>Editor@123</code> | Viewer: <code>viewer</code> / <code>Viewer@123</code></p>
            </div>
        </div>
    </div>
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            if (!username || !password) { errorDiv.textContent = 'Please enter username and password'; errorDiv.style.display = 'block'; return; }
            try {
                const response = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await response.json();
                if (data.success) window.location.href = data.redirect;
                else { errorDiv.textContent = data.error || 'Invalid credentials'; errorDiv.style.display = 'block'; }
            } catch (error) { errorDiv.textContent = 'Network error. Please try again.'; errorDiv.style.display = 'block'; }
        }
        document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
        document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
